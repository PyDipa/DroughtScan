[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "droughtscan"
version = "3.0.0"
description = "Drought monitoring and seasonal prediction toolkit"
authors = [
  { name="Arianna Di Paola"},
  { name="Leandro Rocchi"},
  { name="Massimiliano Pasqui"},
]
maintainers = [
  { name="Arianna Di Paola",email="arianna.dipaola@cnr.it" }
]
readme = "README.md"
requires-python = ">=3.10"
license =  "PolyForm-Noncommercial-1.0.0"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
  "cmcrameri>=1.4",
  "scipy>=1.11",
  "geopandas>=1.0",
  "regionmask>=0.11",
  "netCDF4>=1.6",
  "python-dateutil>=2.8",
]
[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "black", "mypy", "pre-commit"]

[project.urls]
Homepage = "https://droughtcentral.it/"
Team = "https://droughtcentral.it/team/"

[tool.setuptools.packages.find]
where = ["."]
include = ["drought_scan*"]
exclude = ["paper*", "docs*", "tests*", "examples*"]
